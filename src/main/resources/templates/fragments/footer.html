<footer class="footer" xmlns:th="http://www.w3.org/1999/xhtml">
        <div class="container">
            <div class="row">
                <!-- About Section -->
                <div class="col-md-4 mb-4">
                    <h5 th:text="${settingMap['site_department'] != null ? settingMap['site_department'] : 'Khoa CNTT'}"></h5>
                    <p th:text="${settingMap['site_university'] != null ? settingMap['site_university'] : 'Khoa CNTT'}"></p>
                    <p th:text="${settingMap['about_content'] != null ? settingMap['about_content'] : 'Khoa CNTT'}"></p>
                </div>
                <!-- Quick Links -->
                <div class="col-md-4 mb-4">
                    <h5>Liên kết nhanh</h5>
                    <ul class="list-unstyled">
                        <li><a href="https://ntu.edu.vn" target="_blank">Website ĐH Nha Trang</a></li>
                        <li><a href="/admin/support">Hỗ trợ kỹ thuật</a></li>
                        <li><a href="/admin/feedback">Gửi phản hồi</a></li>
                    </ul>
                </div>
                <!-- Contact Info -->
                <div class="col-md-4 mb-4">
                    <h5>Liên hệ</h5>
                    <p>
                        <i class="fas fa-map-marker-alt me-2"></i>
                        <span th:text="${settingMap['site_address'] != null ? settingMap['site_address'] : 'Khoa CNTT'}"></span>
                    </p>
                    <p>
                        <i class="fas fa-envelope me-2"></i>
                        <span th:text="${settingMap['site_email'] != null ? settingMap['site_email'] : 'Khoa CNTT'}"></span>
                    </p>
                    <p>
                        <i class="fas fa-phone me-2"></i>
                        <span th:text="${settingMap['site_hotline'] != null ? settingMap['site_hotline'] : 'Khoa CNTT'}"></span>
                    </p>
                    <div class="social-icons">
                        <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
                        <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
            <hr class="bg-light">
            <div class="text-center">
                <p class="mb-0">
                    © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span>
                    <span th:text="${settingMap['site_department'] + ' - ' + settingMap['site_university']}">Khoa CNTT - Đại học Nha Trang</span>. All rights reserved.
                </p>
            </div>
        </div>
    </footer>
