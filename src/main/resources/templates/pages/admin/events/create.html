<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo sự kiện</title>
    <!-- Sử dụng Bootstrap để định dạng giao diện -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <!-- Tiêu đề trang -->
    <h1>Tạo sự kiện mới</h1>
    <!-- Form tạo sự kiện, hỗ trợ tải lên file -->
    <form th:action="@{/events/admin}" th:object="${event}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Tiêu đề</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea class="form-control" id="description" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label for="startTime" class="form-label">Thời gian bắt đầu</label>
            <input type="datetime-local" class="form-control" id="startTime" th:field="*{startTime}" required>
        </div>
        <div class="mb-3">
            <label for="endTime" class="form-label">Thời gian kết thúc</label>
            <input type="datetime-local" class="form-control" id="endTime" th:field="*{endTime}" required>
        </div>
        <div class="mb-3">
            <label for="bannerFile" class="form-label">Banner (Ảnh)</label>
            <input type="file" class="form-control" id="bannerFile" name="bannerFile" accept="image/*">
        </div>
        <div class="mb-3">
            <label for="registrationUrl" class="form-label">URL Đăng ký</label>
            <input type="text" class="form-control" id="registrationUrl" th:field="*{registrationUrl}">
        </div>
        <div class="mb-3">
            <label for="isActive" class="form-label">Kích hoạt</label>
            <input type="checkbox" id="isActive" th:field="*{isActive}" checked>
        </div>
        <!-- Nút submit form -->
        Workers
        <button type="submit" class="btn btn-primary">Tạo sự kiện</button>
        <!-- Nút hủy -->
        <a href="/events/admin" class="btn btn-secondary">Hủy</a>
    </form>
</div>
</body>
</html>
