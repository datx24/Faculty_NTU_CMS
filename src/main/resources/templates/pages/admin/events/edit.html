<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sự kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Chỉnh sửa sự kiện</h1>
    <!-- Hiển thị thông báo lỗi nếu có -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <!-- Form chỉnh sửa sự kiện -->
    <form th:action="@{/events/admin/edit/{id}(id=${event.id})}" th:object="${event}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Tiêu đề</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label for="startTime" class="form-label">Thời gian bắt đầu</label>
            <input type="datetime-local" class="form-control" id="startTime" th:field="*{startTime}" required>
        </div>
        <div class="mb-3">
            <label for="endTime" class="form-label">Thời gian kết thúc</label>
            <input type="datetime-local" class="form-control" id="endTime" th:field="*{endTime}" required>
        </div>
        <div class="mb-3">
            <label for="bannerFile" class="form-label">Banner hiện tại</label>
            <div th:if="${event.banner}">
                <img th:src="${event.banner}" class="img-fluid mb-2" alt="Banner hiện tại" style="max-height: 100px;">
            </div>
            <input type="file" class="form-control" id="bannerFile" name="bannerFile" accept="image/*">
        </div>
        <div class="mb-3">
            <label for="registrationUrl" class="form-label">URL đăng ký</label>
            <input type="url" class="form-control" id="registrationUrl" th:field="*{registrationUrl}">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="isActive" th:field="*{isActive}">
            <label class="form-check-label" for="isActive">Kích hoạt</label>
        </div>
        <button type="submit" class="btn btn-primary">Cập nhật sự kiện</button>
        <a href="/events/admin" class="btn btn-secondary">Hủy</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
