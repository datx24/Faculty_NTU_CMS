<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản lý sự kiện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Quản lý sự kiện</h1>
  <!-- Hiển thị thông báo thành công hoặc lỗi -->
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <!-- Nút tạo sự kiện mới -->
  <a href="/events/admin/create" class="btn btn-primary mb-3">Tạo sự kiện mới</a>
  <!-- Danh sách sự kiện -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Tiêu đề</th>
      <th>Thời gian bắt đầu</th>
      <th>Trạng thái</th>
      <th>Banner</th>
      <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${events}">
      <td th:text="${event.id}"></td>
      <td th:text="${event.title}"></td>
      <td th:text="${event.startTime}"></td>
      <td>
        <span th:if="${event.isActive}" class="badge bg-success">Kích hoạt</span>
        <span th:unless="${event.isActive}" class="badge bg-secondary">Không kích hoạt</span>
      </td>
      <td>
        <img th:if="${event.banner}" th:src="${event.banner}" alt="Banner" style="max-height: 50px;">
        <span th:unless="${event.banner}">Không có</span>
      </td>
      <td>
        <a th:href="@{/events/admin/edit/{id}(id=${event.id})}" class="btn btn-sm btn-warning">Sửa</a>
        <a th:href="@{/events/admin/delete/{id}(id=${event.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa sự kiện này?')">Xóa</a>
      </td>
    </tr>
    <tr th:if="${events.isEmpty}">
      <td colspan="6" class="text-center">Không có sự kiện nào.</td>
    </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
