<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${menuItem.id != null} ? 'Chỉnh sửa Menu Item' : 'Tạo mới Menu Item'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f4f7fa;
        color: #333;
    }
    .container {
        margin-top: 30px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="mb-4">Chỉnh sửa Menu Item </h1>
  <form th:action="@{/menu/edit/{id}(id=${menuItem.id})}" th:object="${menuItem}" method="post">
    <div class="mb-3">
      <label for="menuName" class="form-label">Tên Menu</label>
      <input type="text" class="form-control" id="menuName" th:field="*{menuName}" required>
    </div>
    <div class="mb-3">
      <label for="label" class="form-label">Label</label>
      <input type="text" class="form-control" id="label" th:field="*{label}" required>
    </div>
    <div class="mb-3">
      <label for="path" class="form-label">Đường dẫn</label>
      <input type="text" class="form-control" id="path" th:field="*{path}" required>
    </div>
    <div class="mb-3">
      <label for="parent" class="form-label">Menu Cha</label>
      <select class="form-select" id="parent" th:field="*{parent.id}">
        <option value="">Không có</option>
        <th:block th:each="parent : ${parentItems}">
          <option th:if="${menuItem.id == null or parent.id != menuItem.id}" th:value="${parent.id}" th:text="${parent.label}" th:selected="${menuItem.parent != null and menuItem.parent.id == parent.id}"></option>
        </th:block>
      </select>
    </div>
    <div class="mb-3">
      <label for="order" class="form-label">Thứ tự</label>
      <input type="number" class="form-control" id="order" th:field="*{order}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Trạng thái</label>
      <div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="activeTrue" th:field="*{active}" value="true">
          <label class="form-check-label" for="activeTrue">Kích hoạt</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="activeFalse" th:field="*{active}" value="false">
          <label class="form-check-label" for="activeFalse">Không kích hoạt</label>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Lưu</button>
    <a th:href="@{/menu}" class="btn btn-secondary">Hủy</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
