<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đại học Nha Trang - Khoa CNTT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/public.css">
    <style>
        .news-section {
            padding: 20px 0;
        }
        .featured-news .card {
            height: 300px;
            overflow: hidden;
        }
        .featured-list {
            height: 300px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        .featured-list .list-group-item {
            border: none;
            padding: 5px 10px;
        }
        .news-carousel .card {
            width: 300px;
            margin: 0 10px;
        }
        .owl-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
        }
        .owl-prev, .owl-next {
            position: absolute;
            font-size: 2em;
            color: #000;
        }
        .owl-prev { left: 10px; }
        .owl-next { right: 10px; }
    </style>
</head>
<body>
<!-- Header -->
<header class="header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-2">
                <img th:src="${settingMap['site_logo'] != null ? settingMap['site_logo'] : '/images/logo-ntu.png'}" alt="Logo ĐH Nha Trang" class="img-fluid" style="max-height: 80px;">
            </div>
            <div class="col-md-10">
                <h1 th:text="${settingMap['site_university'] + ' - ' + settingMap['site_department']}"></h1>
            </div>
        </div>
    </div>
</header>

<!-- Menu List Fragment -->
<th:block th:replace="~{pages/user/menu/list :: menuList(menuItems=${menuItems}, currentPath=${currentPath})}"></th:block>

<!-- Carousel -->
<div id="carouselExample" class="container carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img th:src="${settingMap['site_banner'] != null ? settingMap['site_banner'] : '/images/logo-ntu.png'}" class="d-block w-100" alt="Slide 1">
            <div class="carousel-caption d-none d-md-block">
                <h5>Chào mừng đến với Khoa CNTT</h5>
                <p>Khám phá các chương trình đào tạo chất lượng cao.</p>
            </div>
        </div>
        <div class="carousel-item">
            <img th:src="${settingMap['site_banner'] != null ? settingMap['site_banner'] : '/images/logo-ntu.png'}" class="d-block w-100" alt="Slide 2">
            <div class="carousel-caption d-none d-md-block">
                <h5>Sự kiện nổi bật</h5>
                <p>Tham gia các sự kiện công nghệ sắp tới.</p>
            </div>
        </div>
        <div class="carousel-item">
            <img th:src="${settingMap['site_banner'] != null ? settingMap['site_banner'] : '/images/logo-ntu.png'}" class="d-block w-100" alt="Slide 3">
            <div class="carousel-caption d-none d-md-block">
                <h5>Tin tức mới nhất</h5>
                <p>Cập nhật thông tin từ Khoa CNTT.</p>
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
</div>

<!-- Main Content -->
<div class="container">
    <div class="row">
        <!-- News -->
        <div class="col-md-8">
            <div class="news-section">
                <!-- Thay bằng fragment post-list -->
                <div th:replace="~{pages/user/post/list :: post-list(featuredPost=${featuredPost}, otherPosts=${otherPosts})}"></div>

            </div>
        </div>

        <!-- Events and Notifications -->
        <div class="col-md-4">
            <!-- Events -->
            <div th:replace="~{pages/user/events/list :: event-list(events=${events})}"></div>

            <!-- Notifications -->
            <div th:replace="~{pages/user/notifications/list :: notification-list(notifications=${notifications})}"></div>
        </div>
    </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer}"></th:block>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
