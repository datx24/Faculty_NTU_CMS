<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${post.title} + ' - Chi tiết'">Chi tiết Bài viết</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .content {
        margin-top: 20px;
        white-space: pre-wrap; /* Giữ định dạng dòng của content */
    }
    .thumbnail {
        max-width: 300px;
        margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 th:text="${post.title}">Tiêu đề Bài viết</h1>
  <div class="mb-3">
    <strong>Danh mục:</strong> <span th:text="${post.category != null} ? ${post.category.name} : 'Chưa có danh mục'"></span>
  </div>
  <div class="mb-3">
    <strong>Tác giả:</strong> <span th:text="${post.author != null} ? ${post.author.name} : 'Chưa có tác giả'"></span>
  </div>
  <div class="mb-3">
    <strong>Trạng thái:</strong> <span th:text="${post.status}"></span>
  </div>
  <div class="mb-3">
    <strong>Lượt xem:</strong> <span th:text="${post.viewCount}"></span>
  </div>
  <div class="mb-3">
    <strong>Ngày tạo:</strong> <span th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
  </div>
  <div class="mb-3">
    <strong>Hình ảnh:</strong>
    <img th:if="${post.thumbnail != null}" th:src="@{'/images/' + ${post.thumbnail}}" alt="Thumbnail" class="thumbnail" />
    <span th:if="${post.thumbnail == null}">Không có hình</span>
  </div>
  <div class="content" th:text="${post.content}">Nội dung bài viết...</div>
  <a th:href="@{/admin/posts}" class="btn btn-secondary mt-3">Quay lại</a>
</div>
</body>
</html>
