<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post List</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    h3, h4 {
      font-weight: 600;
    }

    .featured-post {
      border-radius: 0.75rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      object-fit: cover;
    }

    .post-thumbnail-link img,
    .list-group-item img {
      border-radius: 0.5rem;
      object-fit: cover;
    }

    .post-title a, .category-link {
      color: #212529;
      font-weight: 500;
      transition: color 0.3s;
    }

    .post-title a:hover,
    .category-link:hover {
      color: #0d6efd;
      text-decoration: underline;
    }

    .list-group-item {
      padding: 0.75rem 1rem;
      border: none;
      background-color: #ffffff;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .list-group-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .hidden-post {
      display: none;
    }

    #load-more {
      text-align: center;
      display: inline-block;
      margin-top: 0.75rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    #load-more:hover {
      color: #0d6efd;
      text-decoration: underline;
    }

    .category-post-thumbnail {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 0.5rem;
    }

    .post-details {
      background-color: #ffffff;
      border-radius: 0.5rem;
    }

    .post-excerpt {
      color: #6c757d;
      font-size: 0.9rem;
    }

    .category-header h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #343a40;
    }
  </style>
</head>
<body>

<!-- Fragment danh sách bài viết -->
<th:block th:fragment="post-list (featuredPost, otherPosts)">
  <div class="container mt-4">
    <div class="row">
      <!-- Bài viết nổi bật -->
      <div class="col-md-7 mb-4">
        <h3 class="mb-4 text-black">Tin tức nổi bật</h3>
        <div th:if="${featuredPost}">
          <img th:src="${featuredPost.thumbnail} ?: 'https://placehold.co/600x400'"
               th:alt="${featuredPost.title}" class="img-fluid featured-post w-100"
               onerror="this.src='https://placehold.co/600x400';">
          <a th:href="@{/posts/{slug}(slug=${featuredPost.slug})}"
             th:text="${featuredPost.title}" class="d-block mt-2 h5 text-dark text-decoration-none"></a>
        </div>
      </div>

      <!-- Danh sách bài viết khác -->
      <div class="col-md-5">
        <h3 class="mb-4 text-black">Tất cả bài viết</h3>
        <div class="list-group" id="post-list">
          <div th:each="post, iterStat : ${otherPosts}"
               class="list-group-item d-flex align-items-start"
               th:classappend="${iterStat.index >= 5} ? 'hidden-post' : ''">
            <img th:src="${post.thumbnail} ?: 'https://placehold.co/100x100'"
                 th:alt="${post.title}" class="img-thumbnail me-3"
                 style="width: 60px; height: 60px;" onerror="this.src='https://placehold.co/100x100';">
            <div style="flex-grow: 1;" class="post-title d-block">
              <a th:href="@{/posts/{slug}(slug=${post.slug})}"
                 th:text="${post.title.length() > 50} ? ${post.title.substring(0, 50)} + '...' : ${post.title}"
                 class="text-dark text-decoration-none"></a>
            </div>
          </div>
        </div>
        <a href="/post-categories" id="load-more" class="text-primary" th:if="${otherPosts.size() > 5}">Xem thêm...</a>
      </div>
    </div>
  </div>
</th:block>

<!-- Fragment danh mục có bài viết -->
<th:block th:fragment="categories-post-pane(categoriesWithPosts)">
  <div class="row mt-4">
    <th:block th:each="item, iterStat : ${categoriesWithPosts}">
      <div class="col-12 col-sm-6 col-md-3 mb-4" th:if="${iterStat.count <= 4}">
        <div class="category-header pb-3">
          <h3>
            <a th:href="@{'/post-categories/' + ${item.category.slug}}" th:text="${item.category.name}"
               class="category-link">Category Name</a>
          </h3>
        </div>
        <th:block th:if="${item.post != null}">
          <a th:href="@{'/posts/' + ${item.post.slug}}" th:title="${item.post.title}" class="post-thumbnail-link">
            <img class="img-fluid category-post-thumbnail"
                 th:src="${item.post.thumbnail != null ? item.post.thumbnail : '/uploads/1747104672986_1-18.jpg'}"
                 th:alt="${item.post.title}" onerror="this.onerror=null; this.src='/uploads/1747104672986_1-18.jpg';">
          </a>
          <div class="post-details p-3 mt-2">
            <h4 class="post-title mb-2">
              <a th:href="@{'/posts/' + ${item.post.slug}}"
                 th:title="${item.post.title}"
                 th:text="${item.post.title}" class="post-link">Post Title</a>
            </h4>
            <p class="post-excerpt" th:if="${item.post.excerpt}"
               th:text="${#strings.length(item.post.excerpt) > 100 ? #strings.substring(item.post.excerpt, 0, 100) + '...' : item.post.excerpt}">
            </p>
          </div>
        </th:block>
      </div>
    </th:block>
  </div>
</th:block>

<!-- Bootstrap JS Bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Load More Script -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const loadMoreButton = document.getElementById('load-more');

    if (loadMoreButton) {
      loadMoreButton.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelectorAll('.hidden-post').forEach(post => {
          post.classList.remove('hidden-post');
        });
        loadMoreButton.style.display = 'none';
      });
    }
  });
</script>

</body>
</html>
