<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <title>Post List</title>
  <style>
    .list-group-item .post-title {
      display: block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #343a40;
    }
    .featured-post {
      max-width: 100%;
    }
    .hidden-post {
      display: none; /* Ẩn các bài viết ngoài 5 bài mới nhất */
    }
  </style>
</head>
<body>
<!-- Fragment danh sách bài viết -->
<th:block th:fragment="post-list (featuredPost, otherPosts)">
  <div class="container mt-4">
    <h3 class="mb-4 text-primary">Tin tức nổi bật</h3>
    <div class="row">
      <!-- Bài viết nổi bật -->
      <div class="col-md-7 mb-4">
        <div th:if="${featuredPost}">
          <img th:src="${featuredPost.thumbnail} ?: 'https://via.placeholder.com/600x400'"
               th:alt="${featuredPost.title}" class="img-fluid rounded featured-post"
               onerror="this.src='https://via.placeholder.com/600x400';">
          <a th:href="@{/posts/{slug}(slug=${featuredPost.slug})}"
             th:text="${featuredPost.title}" class="d-block mt-2 h5 text-dark"></a>
        </div>
      </div>

      <!-- Danh sách bài viết khác -->
      <div class="col-md-5">
        <h4>Tất cả bài viết</h4>
        <div class="list-group" id="post-list">
          <div th:each="post, iterStat : ${otherPosts}"
               class="list-group-item d-flex align-items-start"
               th:classappend="${iterStat.index >= 5} ? 'hidden-post' : ''">
            <img th:src="${post.thumbnail} ?: 'https://via.placeholder.com/100x100'"
                 th:alt="${post.title}" class="img-thumbnail mr-2"
                 style="width: 60px; height: auto;"
                 onerror="this.src='https://via.placeholder.com/100x100';">
            <div style="flex-grow: 1;" class="post-title text-truncate d-block">
              <a th:href="@{/posts/{slug}(slug=${post.slug})}"
                 th:text="${post.title}"
                 class="text-dark"></a>
            </div>
          </div>
        </div>
        <a href="/post-categories" id="load-more" class="d-block mt-2 text-primary" th:if="${otherPosts.size() > 5}">Xem thêm...</a>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="categories-post-pane(categoriesWithPosts)">

  <div class="row">
    
    <th:block th:each="item, iterStat : ${categoriesWithPosts}">
      <div class="col-12 col-sm-6 col-md-3 mb-4" th:if="${iterStat.count <= 4}">
        
        <div class="category-header pb-3 ">
          <h3>
            <a th:href="@{'/post-categories/' + ${item.category.slug}}"
               th:text="${item.category.name}"
               class="category-link stretched-link">Category Name 
            </a>
          </h3>
        </div>
          <th:block th:if="${item.post != null}">
            <a th:href="@{'/posts/' + ${item.post.slug}}" th:title="${item.post.title}" class="post-thumbnail-link">
              <img class="img-fluid category-post-thumbnail" 
                   th:src="${item.post.thumbnail != null ? item.post.thumbnail : '/uploads/1747104672986_1-18.jpg'}"
                   th:alt="${item.post.title}"
                   onerror="this.onerror=null; this.src='/uploads/1747104672986_1-18.jpg';">
            </a>
            <div class="post-details p-3">
              <h4 class="post-title mb-2">
                <a th:href="@{'/posts/' + ${item.post.slug}}"
                   th:title="${item.post.title}"
                   th:text="${item.post.title}"
                   class="post-link stretched-link">Post Title 
              </h4>
              <p class="post-excerpt" th:if="${item.post.excerpt}" th:text="${#strings.abbreviate(item.post.excerpt, 100)}"></p> <!-- Abbreviate excerpt -->
            </div>
          </th:block>

          <th:block th:if="${item.post == null}">
            <div class="no-post-message p-3">
             
              <img src="/path/to/default-category-image.jpg" class="img-fluid mb-2" alt="No post available">
              <p class="text-muted mt-3">Không có bài viết mới trong danh mục này.</p>
            </div>
          </th:block>

        
      </div> 
    </th:block>
  </div>

</th:block>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
  // Đảm bảo JavaScript chạy sau khi DOM được tải hoàn toàn
  document.addEventListener('DOMContentLoaded', function() {
    const loadMoreButton = document.getElementById('load-more');

    if (loadMoreButton) {
      loadMoreButton.addEventListener('click', function(e) {
        e.preventDefault(); // Ngăn hành vi mặc định của thẻ <a>

        // Hiển thị tất cả bài viết ẩn
        document.querySelectorAll('.hidden-post').forEach(post => {
          post.classList.remove('hidden-post');
        });

        // Ẩn nút "Xem thêm"
        loadMoreButton.style.display = 'none';
      });
    }
  });
</script>
</body>
</html>
