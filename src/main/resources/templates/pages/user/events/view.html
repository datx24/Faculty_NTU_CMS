<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${event.title}">Chi tiết sự kiện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/public.css">
  <style>
    /* Event Card Styles */
    .event-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin-top: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .event-card h1 {
      font-size: 2rem;
      color: #1e3a8a;
      margin-bottom: 1rem;
      font-weight: 700;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .event-card .created-at {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1rem;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .event-card .banner-img {
      max-height: 300px;
      width: 100%;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .event-card p {
      font-size: 1.1rem;
      color: #4b5563;
      margin-bottom: 1rem;
      line-height: 1.8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .event-card strong {
      color: #1e3a8a;
      font-weight: 600;
    }

    .event-card span {
      color: #4b5563;
    }

    /* Button Styles */
    .event-card .btn-primary {
      background-color: #3b82f6;
      border-color: #3b82f6;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.3s ease, transform 0.2s ease;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .event-card .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
      transform: translateY(-2px);
    }

    .event-card .btn-secondary {
      background-color: #6b7280;
      border-color: #6b7280;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.3s ease, transform 0.2s ease;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .event-card .btn-secondary:hover {
      background-color: #4b5563;
      border-color: #4b5563;
      transform: translateY(-2px);
    }

    /* Responsive Adjustments */
    @media (max-width: 576px) {
      .event-card {
        padding: 1.5rem;
        margin-top: 1rem;
      }

      .event-card h1 {
        font-size: 1.5rem;
      }

      .event-card .created-at {
        font-size: 0.85rem;
      }

      .event-card p {
        font-size: 1rem;
      }

      .event-card .banner-img {
        max-height: 200px;
      }

      .event-card .btn-primary,
      .event-card .btn-secondary {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>
<!-- Header -->
<header class="header">
  <div class="container">
      <div class="row align-items-center">
          <div class="col-md-2">
              <a href="/">
                  <img th:src="${settingMap['site_logo'] != null ? settingMap['site_logo'] : '/images/logo-ntu.png'}" alt="Logo ĐH Nha Trang" class="img-fluid" style="max-height: 80px;">
              </a>    
          </div>
          <div class="col-md-10">
              <h1 th:text="${settingMap['site_university'] + ' - ' + settingMap['site_department']}"></h1>
          </div>
      </div>
  </div>
</header>

<div class="container">
  <div class="event-card">
    <!-- Hiển thị tiêu đề sự kiện -->
    <h1 th:text="${event.title}">Tiêu đề sự kiện</h1>
    <!-- Hiển thị ngày tạo -->
    <p class="created-at" th:text="'Đăng ngày: ' + ${#temporals.format(event.createdAt, 'dd/MM/yyyy')}"></p>
    <!-- Hiển thị banner nếu có -->
    <img th:if="${event.banner}" th:src="${event.banner}" class="banner-img" alt="Banner sự kiện">
    <!-- Hiển thị placeholder nếu không có banner -->
    <img th:unless="${event.banner}" src="https://via.placeholder.com/1200x300" class="banner-img" alt="No banner">
    <!-- Hiển thị mô tả -->
    <p th:text="${event.description}">Mô tả sự kiện</p>
    <!-- Hiển thị thời gian -->
    <p><strong>Bắt đầu:</strong> <span th:text="${event.startTime}"></span></p>
    <p><strong>Kết thúc:</strong> <span th:text="${event.endTime}"></span></p>
    <!-- Hiển thị người tạo -->
    <p><strong>Người tạo:</strong> <span th:text="${event.createdBy.name}"></span></p>
    <!-- Hiển thị nút đăng ký nếu có URL -->
    <p th:if="${event.registrationUrl}">
      <a th:href="${event.registrationUrl}" class="btn btn-primary">Đăng ký ngay</a>
    </p>
    <!-- Nút quay lại -->
    <a href="/" class="btn btn-secondary">Quay lại trang chủ</a>
  </div>
</div>
<!-- Footer -->
<th:block th:replace="~{fragments/footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
