<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${page.title} + ' - Chi tiết'"></title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/public.css" rel="stylesheet">
    <style>
        .content {
            margin-top: 20px;
            white-space: pre-wrap;
        }

        .thumbnail {
            max-width: 300px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-2">
                    <a href="/">
                      <img th:src="${settingMap['site_logo'] != null ? settingMap['site_logo'] : '/images/logo-ntu.png'}" alt="Logo ĐH Nha Trang" class="img-fluid" style="max-height: 80px;">
                    </a> 
                  </div>
                <div class="col-md-10">
                    <h1 th:text="${settingMap['site_university'] + ' - ' + settingMap['site_department']}"></h1>
                </div>
            </div>
        </div>
    </header>
    <th:block th:replace="~{pages/user/menu/list :: menuList(menuItems=${menuItems}, currentPath=${currentPath})}">
    </th:block>

    <!-- Main Content -->
    <main th:utext="${page.content}"style="padding: 15px; min-height: 300px;">
        
    </main>
</body>

</html>
