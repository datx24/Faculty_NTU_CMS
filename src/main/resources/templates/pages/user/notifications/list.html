<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="notification-list">
  <div class="notifications-section">
    <h4>Thông báo</h4>
    <div class="list-group">
      <div th:each="notification : ${notifications}" class="notification-item">
                    <span th:classappend="${notification.announcementType.toString().toLowerCase()}"
                          class="notification-type"
                          th:text="${notification.announcementType}"></span>
        <a th:href="@{/notifications/{id}(id=${notification.id})}"
           th:text="${notification.title}"
           class="notification-title"></a>
        <div class="notification-dates">
          <i class="fas fa-calendar-alt"></i>
          <span th:text="${#temporals.format(notification.startDate, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(notification.endDate, 'dd/MM/yyyy')}"></span>
        </div>
      </div>
      <div th:if="${notifications.isEmpty()}" class="text-muted text-center">Chưa có thông báo.</div>
    </div>
  </div>
</th:block>
</body>
</html>
