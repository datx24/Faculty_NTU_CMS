<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${notification.title}">Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/public.css">
    <style>
        /* Notification Content Styles */
        .notification-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-top: 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .notification-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .notification-card h1 {
            font-size: 2rem;
            color: #1e3a8a;
            margin-bottom: 1rem;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .notification-card .created-at {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .notification-card .message {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 1.5rem;
            line-height: 1.8;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .notification-card p {
            margin: 0.5rem 0;
            font-size: 1rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .notification-card strong {
            color: #1e3a8a;
            font-weight: 600;
        }

        .notification-card span {
            color: #4b5563;
        }

        /* Responsive Adjustments */
        @media (max-width: 576px) {
            .notification-card {
                padding: 1.5rem;
                margin: 1rem;
            }

            .notification-card h1 {
                font-size: 1.5rem;
            }

            .notification-card .created-at {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-2">
                <a href="/">
                    <img th:src="${settingMap['site_logo'] != null ? settingMap['site_logo'] : '/images/logo-ntu.png'}" alt="Logo ĐH Nha Trang" class="img-fluid" style="max-height: 80px;">
                </a>    
            </div>
            <div class="col-md-10">
                <h1 th:text="${settingMap['site_university'] + ' - ' + settingMap['site_department']}"></h1>
                <h1 th:text="${settingMap['site_university'] + ' - ' + settingMap['site_department']}"></h1>
            </div>
        </div>
    </div>
</header>
<th:block th:replace="~{pages/user/menu/list :: menuList(menuItems=${menuItems}, currentPath=${currentPath})}">
</th:block>

<div class="container">
    <div class="notification-card">
        <h1 th:text="${notification.title}"></h1>
        <p class="created-at" th:text="'Đăng ngày: ' + ${#temporals.format(notification.createdAt, 'dd/MM/yyyy')}"></p>
        <div class="message" th:utext="${notification.message}"></div>
        <p><strong>Loại:</strong> <span th:text="${notification.announcementType}"></span></p>
        <p><strong>Thời gian:</strong>
            <span th:text="${#temporals.format(notification.startDate, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(notification.endDate, 'dd/MM/yyyy')}"></span>
        </p>
    </div>
</div>
<!-- Footer -->
<th:block th:replace="~{fragments/footer}"></th:block>
</body>
</html>
